Peripherals:
  TIM:
    TIM1:
      Period: 1000-1
      Prescaler: 72-1
    TIM2:
      Period: 1000-1
      Prescaler: 72-1
    TIM3:
      Prescaler: 72-1
    TIM4:
      Mode: TIM_MASTERSLAVEMODE_DISABLE
      Period: 1000-1
      Prescaler: 72-1
      Channels:
        CH4:
          Label: TIM4
          PWM: true
          Complementary: false
          DutyCycle: null
  ADC:
    ADC1:
      ContinuousMode: false
      RegularConversions:
      - ADC_CHANNEL_TEMPSENSOR
      Channels:
      - ADC_CHANNEL_TEMPSENSOR
      - ADC_CHANNEL_VREFINT
      DMA: DISABLE
  USART:
    USART1:
      BaudRate: 115200
      WordLength: WORDLENGTH_8B
      Parity: PARITY_NONE
      StopBits: STOPBITS_1
      Mode: Asynchronous
      dma:
        dma_rx: &id001
          request_id: '1'
          peripheral: USART1_RX
          dma_type: DMA
          stream: DMA1_Channel5
          direction: MEMORY
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
        dma_tx: &id002
          request_id: '0'
          peripheral: USART1_TX
          dma_type: DMA
          stream: DMA1_Channel4
          direction: PERIPH
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
    USART2:
      BaudRate: 115200
      WordLength: WORDLENGTH_8B
      Parity: PARITY_NONE
      StopBits: STOPBITS_1
      Mode: Asynchronous
      dma:
        dma_rx: &id003
          request_id: '3'
          peripheral: USART2_RX
          dma_type: DMA
          stream: DMA1_Channel6
          direction: MEMORY
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
        dma_tx: &id004
          request_id: '2'
          peripheral: USART2_TX
          dma_type: DMA
          stream: DMA1_Channel7
          direction: PERIPH
          periph_inc: false
          mem_inc: false
          periph_align: byte
          mem_align: byte
          mode: Normal
          priority: Low
      DMA_RX: ENABLE
      DMA_RX_TYPE: DMA
      DMA_TX: ENABLE
      DMA_TX_TYPE: DMA
  SPI: {}
  I2C: {}
DMA:
  Requests:
    '0': USART1_TX
    '1': USART1_RX
    '2': USART2_TX
    '3': USART2_RX
    sNb: '4'
  Configurations:
    USART1_RX_1: *id001
    USART1_TX_0: *id002
    USART2_RX_3: *id003
    USART2_TX_2: *id004
Timebase:
  Source: SysTick
  IRQ: null
Mcu:
  Family: STM32F1
  Type: STM32F103C8T6
